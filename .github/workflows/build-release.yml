name: 构建并发布 SageAttention Wheels

on:
  workflow_dispatch:
    inputs:
      torch_version:
        description: "PyTorch 版本"
        required: true
        default: "2.13.0"
        type: choice
        options:
          - "2.13.0"
          - "2.14.0"
      sage_ref:
        description: "SageAttention 已审核版本"
        required: true
        default: "v2.2.0"
        type: choice
        options:
          - "v2.2.0"
      sm_list:
        description: "目标 GPU 架构，空格分隔"
        required: true
        default: "80 86 89 120"
        type: string
      max_jobs:
        description: "单个架构的并行编译任务数"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
      release_tag:
        description: "可选：自定义 Release tag；留空则自动生成"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sageattention-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 SageAttention Wheels
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CUDA_TAG: cu130
      PY_TAG: cp313

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: 解析并校验构建配置
        env:
          INPUT_TORCH_VERSION: ${{ inputs.torch_version }}
          INPUT_SAGE_REF: ${{ inputs.sage_ref }}
          INPUT_SM_LIST: ${{ inputs.sm_list }}
          INPUT_MAX_JOBS: ${{ inputs.max_jobs }}
        shell: bash
        run: |
          set -euo pipefail
          torch_version="${INPUT_TORCH_VERSION:-2.13.0}"
          sage_ref="${INPUT_SAGE_REF:-v2.2.0}"
          sm_list="${INPUT_SM_LIST:-80 86 89 120}"
          max_jobs="${INPUT_MAX_JOBS:-1}"

          [[ "$torch_version" =~ ^2\.(13|14)\.0$ ]] || { echo "Invalid torch_version" >&2; exit 1; }
          case "$sage_ref" in
            v2.2.0) sage_commit="eb615cf6cf4d221338033340ee2de1c37fbdba4a" ;;
            *) echo "Unapproved sage_ref" >&2; exit 1 ;;
          esac
          [[ "$sm_list" =~ ^(80|86|89|90|120)(\ (80|86|89|90|120))*$ ]] || { echo "Invalid sm_list" >&2; exit 1; }
          [[ "$max_jobs" =~ ^(1|2|4)$ ]] || { echo "Invalid max_jobs" >&2; exit 1; }

          {
            echo "TORCH_VER=$torch_version"
            echo "SAGE_REF=$sage_ref"
            echo "SAGE_COMMIT=$sage_commit"
            echo "SM_LIST=$sm_list"
            echo "MAX_JOBS=$max_jobs"
          } >> "$GITHUB_ENV"

      - name: 构建 Python 3.13 Builder
        shell: bash
        run: |
          set -euo pipefail
          chmod +x prepare-builder.sh
          df -h
          build_image="$(
            TORCH_VER="$TORCH_VER" \
            CUDA_TAG="$CUDA_TAG" \
            PY_TAG="$PY_TAG" \
            BUILDER_IMAGE="sageattention-builder:${GITHUB_RUN_ID}" \
            ./prepare-builder.sh
          )"
          echo "BUILD_IMAGE=$build_image" >> "$GITHUB_ENV"
          docker system df
          df -h

      - name: 构建目标 GPU 架构
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh build-all.sh build-wheel.sh prepare-builder.sh
          BUILD_BACKEND=docker \
          BASE_IMAGE="$BUILD_IMAGE" \
          SAGE_REF="$SAGE_REF" \
          SAGE_COMMIT="$SAGE_COMMIT" \
          TORCH_VER="$TORCH_VER" \
          CUDA_TAG="$CUDA_TAG" \
          PY_TAG="$PY_TAG" \
          SM_LIST="$SM_LIST" \
          MAX_JOBS="$MAX_JOBS" \
          SKIP_APT=1 \
          SKIP_PIP_DEPS=1 \
          ./build-all.sh

          expected_count="$(wc -w <<< "$SM_LIST" | tr -d ' ')"
          actual_count="$(find dist -maxdepth 1 -name 'sageattention-*.whl' | wc -l | tr -d ' ')"
          if [ "$actual_count" != "$expected_count" ]; then
            echo "Expected $expected_count wheels, found $actual_count" >&2
            exit 1
          fi

          for sm in $SM_LIST; do
            find dist -maxdepth 1 -name "sageattention-*-${sm}-cp313-cp313-linux_x86_64.whl" \
              -print -quit | grep -q . || {
                echo "Missing expected SM${sm} cp313 Linux x86_64 wheel" >&2
                exit 1
              }
          done

          (cd dist && sha256sum -c SHA256SUMS)
          for wheel in dist/sageattention-*.whl; do
            unzip -l "$wheel" | grep -Eq 'sageattention/.*\.so$' || {
              echo "No compiled extension found in $wheel" >&2
              exit 1
            }
          done
          ls -lh dist

      - name: 检查 Wheel 依赖和导入
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/sageattention-*.whl; do
            wheel_name="$(basename "$wheel")"
            docker run --rm \
              -v "$PWD/dist:/wheels:ro" \
              "$BUILD_IMAGE" bash -lc "
                set -euo pipefail
                auditwheel show '/wheels/$wheel_name'
                python -m pip install --no-deps --force-reinstall '/wheels/$wheel_name'
                python -c 'import sageattention; from sageattention import sageattn; print(sageattention.__file__)'
              "
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sageattention-wheels
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sageattention-wheels
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TORCH_VERSION: ${{ inputs.torch_version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SM_LIST: ${{ inputs.sm_list }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

          wheel_path="$(find dist -maxdepth 1 -name 'sageattention-*.whl' -print -quit)"
          wheel_name="${wheel_path##*/}"
          sage_version="${wheel_name#sageattention-}"
          sage_version="${sage_version%%-*}"
          torch_version="${INPUT_TORCH_VERSION:-2.13.0}"
          release_tag="${INPUT_RELEASE_TAG:-}"
          sm_list="${INPUT_SM_LIST:-80 86 89 120}"
          sage_commit="eb615cf6cf4d221338033340ee2de1c37fbdba4a"

          [[ "$sage_version" =~ ^[0-9]+(\.[0-9]+)+$ ]] || {
            echo "Unable to detect SageAttention version from: $wheel_name" >&2
            exit 1
          }
          [[ "$torch_version" =~ ^2\.(13|14)\.0$ ]] || { echo "Invalid torch_version" >&2; exit 1; }
          [[ "$release_tag" =~ ^[A-Za-z0-9._-]*$ ]] || { echo "Invalid release_tag" >&2; exit 1; }
          [[ "$sm_list" =~ ^(80|86|89|90|120)(\ (80|86|89|90|120))*$ ]] || { echo "Invalid sm_list" >&2; exit 1; }

          if [ -z "$release_tag" ]; then
            release_tag="sage-${sage_version}-torch-${torch_version}-cu130-py313"
          fi

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $release_tag" >&2
            echo "Use a different release_tag to preserve existing releases." >&2
            exit 1
          fi

          gh release create "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$release_tag" \
            --target "$GITHUB_SHA" \
            --notes "SageAttention ${sage_version} @ ${sage_commit}; PyTorch ${torch_version}+cu130; Python 3.13; SM ${sm_list}. Built on Ubuntu 22.04." \
            dist/*
